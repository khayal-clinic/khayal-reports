<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAYAL CLINIC - Prescription</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h2 { color: #1a4a5a; }
        .input-group { margin: 20px 0; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { background-color: #0f6b7a; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #0d5a66; }
        .hidden { display: none; }
        .error { color: red; margin-top: 10px; }
        .report-data { text-align: right; white-space: pre-wrap; background-color: #f9fbfc; padding: 15px; border-radius: 8px; border: 1px solid #e1e8ed; margin-top: 20px; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 KHAYAL CLINIC</h2>
        <p>هذه الوصفة محمية. أدخل كلمة المرور لعرضها.</p>

        <div id="password-section" class="input-group">
            <input type="password" id="password" placeholder="أدخل كلمة المرور...">
            <br><br>
            <button onclick="decryptReport()">عرض الوصفة</button>
            <p id="error" class="error hidden"></p>
        </div>

        <div id="report-section" class="hidden">
            <h3>✅ تم فك التشفير بنجاح</h3>
            <div id="report-data" class="report-data"></div>
        </div>
    </div>

    <script>
        // ✅ دالة فك التشفير (AES-256) - متوافقة مع التطبيق
        async function decryptReport() {
            const password = document.getElementById('password').value;
            const encryptedData = new URLSearchParams(window.location.search).get('data');
            
            if (!encryptedData) {
                showError('لا توجد بيانات في الرابط.');
                return;
            }

            try {
                // فك تشفير Base64
                const combined = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
                
                // استخراج Salt و IV
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 32);
                const ciphertext = combined.slice(32);

                // اشتقاق المفتاح
                const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw",
                    enc.encode(password),
                    { name: "PBKDF2" },
                    false,
                    ["deriveBits", "deriveKey"]
                );

                const key = await window.crypto.subtle.deriveKey(
                    {
                        name: "PBKDF2",
                        salt: salt,
                        iterations: 10000,
                        hash: "SHA-256"
                    },
                    keyMaterial,
                    { name: "AES-CBC", length: 256 },
                    false,
                    ["decrypt"]
                );

                // فك التشفير
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-CBC", iv: iv },
                    key,
                    ciphertext
                );

                const decoder = new TextDecoder();
                const reportText = decoder.decode(decrypted);

                document.getElementById('password-section').classList.add('hidden');
                document.getElementById('report-section').classList.remove('hidden');
                document.getElementById('report-data').textContent = reportText;

            } catch (e) {
                showError('❌ كلمة المرور خاطئة أو البيانات تالفة.');
            }
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.classList.remove('hidden');
        }
    </script>
</body>
</html>
